baseURL = 'http://example.org/'
languageCode = 'en-us'
title = "Alfin's Notes"
theme = "blowfish"

defaultContentLanguage = "en"

# GitHub Actions passes --baseURL at build time; this local value is a fallback
summaryLength = 70

# Recommended for Blowfish shortcodes
enableInlineShortcodes = true

[params]
  description = "Notes, writeups, and experiments"
  defaultAppearance = "auto"  # "light" | "dark" | "auto"

[pagination]
  pagerSize = 10

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    name = "About"
    url = "/pages/about/"
    weight = 20

# Keep JSON output for search index compatibility
[outputs]
  home = ["HTML", "JSON"]

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    lineNumbersInTable = false
    tabWidth = 4
    style = "dracula"
  [markup.tableOfContents]
    endLevel = 5
    ordered = false
    startLevel = 1
